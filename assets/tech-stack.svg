          background: #0d1117;
          border-radius: 8px;
          padding: 20px 0;
          box-sizing: border-box;
          border: 1px solid #30363d;
        }
        .track {
          display: flex;
          width: max-content;
          animation: scroll 25s linear infinite;
          will-change: transform;
        }
        .item {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 0 24px;
          color: #c9d1d9;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          font-weight: 600;
          font-size: 14px;
          white-space: nowrap;
        }
        .item svg {
          width: 28px;
          height: 28px;
          flex-shrink: 0;
        }
        @keyframes scroll {
          0% { transform: translate3d(0, 0, 0); }
          100% { transform: translate3d(-50%, 0, 0); }
        }
