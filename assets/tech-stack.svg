<svg fill="none" viewBox="0 0 900 90" width="100%" height="90" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .track { animation: scroll 30s linear infinite; }
    .track:hover { animation-play-state: paused; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 6px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    
    @keyframes scroll {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-2200px); }
    }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <g class="track">
    <!-- ================= SET 1 ================= -->
    <!-- HTML5 -->
    <g transform="translate(10, 25)">
      <rect width="100" height="40" class="card" />
      <path fill="#E34F26" d="M1.5 0h17l-1.5 17-7 2-7-2z" transform="translate(12, 10) scale(1)"/>
      <text x="58" y="25" text-anchor="middle" class="badge">HTML5</text>
    </g>

    <!-- CSS3 -->
    <g transform="translate(120, 25)">
      <rect width="100" height="40" class="card" />
      <path fill="#1572B6" d="M1.5 0h17l-1.5 17-7 2-7-2z" transform="translate(12, 10) scale(1)"/>
