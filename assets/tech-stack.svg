      <text x="60" y="25" text-anchor="middle" class="badge">CSS3</text>
    </g>

    <g transform="translate(1340, 25)">
      <rect width="110" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tailwindcss/tailwindcss-original.svg" x="12" y="10" width="20" height="20" />
      <text x="65" y="25" text-anchor="middle" class="badge">Tailwind</text>
    </g>

    <g transform="translate(1460, 25)">
      <rect width="110" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" x="12" y="10" width="20" height="20" />
      <text x="65" y="25" text-anchor="middle" class="badge">JS / TS</text>
    </g>

    <g transform="translate(1580, 25)">
      <rect width="100" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" x="12" y="10" width="20" height="20" />
      <text x="60" y="25" text-anchor="middle" class="badge">React</text>
    </g>

    <g transform="translate(1690, 25)">
      <rect width="110" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" x="12" y="10" width="20" height="20" />
      <text x="65" y="25" text-anchor="middle" class="badge">Node.js</text>
    </g>

    <g transform="translate(1810, 25)">
      <rect width="100" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/express/express-original.svg" x="12" y="10" width="20" height="20" style="filter: invert(1);" />
      <text x="60" y="25" text-anchor="middle" class="badge">Express</text>
    </g>

    <g transform="translate(1920, 25)">
      <rect width="110" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mongodb/mongodb-original.svg" x="12" y="10" width="20" height="20" />
      <text x="65" y="25" text-anchor="middle" class="badge">MongoDB</text>
    </g>

    <g transform="translate(2040, 25)">
      <rect width="80" height="40" class="card" />
