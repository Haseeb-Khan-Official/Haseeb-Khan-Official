    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      rx: 6px;
    }
    @keyframes scroll {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-1100px); }
    }
  </style>

