      <text x="50" y="25" text-anchor="middle" class="badge">PHP</text>
    </g>

    <g transform="translate(2130, 25)">
      <rect width="90" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" x="10" y="10" width="20" height="20" />
      <text x="55" y="25" text-anchor="middle" class="badge">Python</text>
    </g>
