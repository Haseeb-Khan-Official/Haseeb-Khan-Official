<svg fill="none" viewBox="0 0 900 90" width="100%" height="90" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .track {
      animation: scroll 25s linear infinite;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #c9d1d9;
    }
    .card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      rx: 6px;
    }
    @keyframes scroll {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-1110px); }
    }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <g class="track">
    <!-- Set 1 -->
    <g transform="translate(10, 25)">
      <rect width="100" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" x="12" y="10" width="20" height="20" />
      <text x="60" y="25" text-anchor="middle" class="badge">HTML5</text>
    </g>

    <g transform="translate(120, 25)">
      <rect width="100" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" x="12" y="10" width="20" height="20" />
      <text x="60" y="25" text-anchor="middle" class="badge">CSS3</text>
    </g>

    <g transform="translate(230, 25)">
      <rect width="110" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tailwindcss/tailwindcss-original.svg" x="12" y="10" width="20" height="20" />
      <text x="65" y="25" text-anchor="middle" class="badge">Tailwind</text>
    </g>

    <g transform="translate(350, 25)">
      <rect width="110" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" x="12" y="10" width="20" height="20" />
      <text x="65" y="25" text-anchor="middle" class="badge">JS / TS</text>
    </g>

    <g transform="translate(470, 25)">
      <rect width="100" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" x="12" y="10" width="20" height="20" />
      <text x="60" y="25" text-anchor="middle" class="badge">React</text>
    </g>

    <g transform="translate(580, 25)">
      <rect width="110" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" x="12" y="10" width="20" height="20" />
      <text x="65" y="25" text-anchor="middle" class="badge">Node.js</text>
    </g>

    <g transform="translate(700, 25)">
      <rect width="100" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/express/express-original.svg" x="12" y="10" width="20" height="20" style="filter: invert(1);" />
      <text x="60" y="25" text-anchor="middle" class="badge">Express</text>
    </g>

    <g transform="translate(810, 25)">
      <rect width="110" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mongodb/mongodb-original.svg" x="12" y="10" width="20" height="20" />
      <text x="65" y="25" text-anchor="middle" class="badge">MongoDB</text>
    </g>

    <g transform="translate(930, 25)">
      <rect width="80" height="40" class="card" />
      <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/php/php-original.svg" x="10" y="10" width="20" height="20" />
      <text x="50" y="25" text-anchor="middle" class="badge">PHP</text>
    </g>

    <g transform="translate(1020, 25)">
      <rect width="90" height="40" class="card" />
