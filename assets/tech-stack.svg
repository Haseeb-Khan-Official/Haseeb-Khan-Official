
<svg fill="none" viewBox="0 0 900 90" width="100%" height="90" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .track {
      animation: scroll 17s linear infinite;
